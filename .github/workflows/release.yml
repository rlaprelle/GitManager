# Cuts a release when a version tag is pushed (`npm version 0.2.1`, then `git push --follow-tags`).
# Every test suite must pass before anything is published. The installer and latest.yml go to a
# *draft* GitHub release; publishing the draft is what makes installed apps update.
name: Release

on:
  push:
    tags: ['v*']

# Uploading release assets needs write access to the repository's contents; nothing else does.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # scripts/*.ts run under Node's own type stripping.
          node-version: 24
          cache: npm

      - name: The tag matches package.json's version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match package.json version $version"
          }

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:e2e

      - run: npm run test:e2e:app

      - name: Build and upload the installer to a draft release
        run: npm run build:app && npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
