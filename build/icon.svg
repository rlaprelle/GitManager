<!-- App icon, 48 px and up: the header logo in white on the accent-blue tile.
     Edit this, then run `npm run icon` to regenerate build/icon.ico. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74b0ff" />
      <stop offset="1" stop-color="#3d74db" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)" />
  <g transform="translate(100 100) scale(13)" fill="none" stroke="#ffffff" stroke-width="2.8"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="2.5" />
    <circle cx="6" cy="18" r="2.5" />
    <circle cx="18" cy="9" r="2.5" />
    <path d="M6 8.5v7" />
    <path d="M18 11.5c0 4-6 3-11 5" />
  </g>
</svg>
