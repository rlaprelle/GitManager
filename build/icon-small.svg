<!-- App icon, 32 px and below (taskbar, title bar, browser tab): full-bleed tile, larger glyph
     and heavier strokes so it stays legible. Keep in step with icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74b0ff" />
      <stop offset="1" stop-color="#3d74db" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#tile)" />
  <g transform="translate(64 64) scale(16)" fill="none" stroke="#ffffff" stroke-width="3.4"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="2.5" />
    <circle cx="6" cy="18" r="2.5" />
    <circle cx="18" cy="9" r="2.5" />
    <path d="M6 8.5v7" />
    <path d="M18 11.5c0 4-6 3-11 5" />
  </g>
</svg>
