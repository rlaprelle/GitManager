# Windows-only installer for Git Manager. Run with `npm run dist`.
# Unsigned for now: SmartScreen shows "Windows protected your PC" on downloaded
# copies until we pay for a code-signing certificate.

# Must match APP_USER_MODEL_ID in electron/main/index.ts.
appId: com.echel.gitmanager
productName: Git Manager
directories:
  output: release

# electron-vite already bundles everything (Vue included) into out/, so ship
# only that. package.json is always added; it supplies "main" and the version.
files:
  - out/**

win:
  target: nsis
  # Generated from build/icon.svg + icon-small.svg by `npm run icon`; also the installer's icon.
  icon: build/icon.ico
  executableName: GitManager

nsis:
  # Assisted installer, current user only: no admin rights, no UAC prompt.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: GitManager-Setup-${version}.${ext}

# The bundled fonts are SIL OFL 1.1, which requires their license to travel with them.
extraResources:
  - from: node_modules/@fontsource-variable/inter/LICENSE
    to: licenses/Inter-OFL.txt
  - from: node_modules/@fontsource-variable/jetbrains-mono/LICENSE
    to: licenses/JetBrains-Mono-OFL.txt
